<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ecdc4"/>
      <stop offset="100%" style="stop-color:#44a8b3"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#45b7aa"/>
      <stop offset="100%" style="stop-color:#3d9e93"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Stylized A / Temple shape -->
  <path d="M256 100 L160 340 L192 340 L216 270 L296 270 L320 340 L352 340 Z" fill="url(#accent)" opacity="0.95"/>
  <rect x="224" y="230" width="64" height="8" rx="2" fill="#1a1a2e" opacity="0.5"/>
  <!-- Wave 1 -->
  <path d="M80 330 Q128 300 176 330 Q224 360 272 330 Q320 300 368 330 Q416 360 432 340" fill="none" stroke="url(#wave1)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
  <!-- Wave 2 -->
  <path d="M80 360 Q128 330 176 360 Q224 390 272 360 Q320 330 368 360 Q416 390 432 370" fill="none" stroke="url(#wave2)" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <!-- Dots representing cards/nodes -->
  <circle cx="170" cy="160" r="8" fill="#ffe66d" opacity="0.8"/>
  <circle cx="342" cy="160" r="8" fill="#ffe66d" opacity="0.8"/>
  <circle cx="256" cy="395" r="6" fill="#4ecdc4" opacity="0.6"/>
